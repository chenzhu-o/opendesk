[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendesk"
version = "0.3.0"
description = "OpenDesk by VitalOps — open-source computer-use MCP server that lets AI agents see and control macOS, Windows and Linux desktops, locally or across paired machines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "VitalOps" }]
keywords = [
    "computer-use", "mcp", "mcp-server", "model-context-protocol",
    "desktop-automation", "ai-agent", "claude", "accessibility",
    "screenshot", "ocr", "rpa", "remote-desktop", "screen-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Operating System",
]

# The MCP server and local computer use work out of the box, so
# `uvx opendesk mcp` / `uvx --from opendesk opendesk-mcp` need no extras.
# mcp is capped below 2.0: the low-level Server API changed in 2.x.
dependencies = [
    "pydantic>=2.0",
    "msgpack>=1.0",
    "mcp>=1.26,<2",
    "mss>=9.0",
    "Pillow>=10.0",
    "pyautogui>=0.9",
]

[project.optional-dependencies]
# Compatibility aliases: these used to be required for computer use and the
# MCP server; both are now base dependencies.
core = []
mcp = []

# OpenAI-compatible function calling adapter
openai = [
    "openai>=1.0",
]

# LangChain tool adapter
langchain = [
    "langchain-core>=0.2",
]

# Linux accessibility (AT-SPI2)
linux = [
    "pyatspi",
]

# Windows accessibility (UI Automation)
windows = [
    "pywinauto",
    "pygetwindow",
    "pyperclip",
]

# OCR — optional, native backends work without this
ocr = [
    "pytesseract",
]

# Learn/replay — record and replay computer tasks
learn = [
    "pynput",
]

# Screen memory — background capture + OCR + local search.  pynput powers
# the pause hotkey; OCR uses pytesseract when present, else the native engine.
memory = [
    "opendesk[core]",
    "pynput",
]

# Scheduled tasks
schedule = [
    "apscheduler>=3.10",
]

# Remote computer use — control another machine over the network.
# Includes the WebSocket transport, mDNS discovery, and Noise-handshake auth.
remote = [
    "websockets>=12.0",
    "cryptography>=42.0",
    "zeroconf>=0.140",
]

# Local UI — `opendesk app` (FastAPI + uvicorn).
app = [
    "opendesk[remote]",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

# Everything
all = [
    "opendesk[core,mcp,openai,langchain,ocr,learn,memory,schedule,remote,app]",
]

[project.scripts]
opendesk-mcp = "opendesk.integrations.mcp:main"
opendesk = "opendesk.cli:main"

[project.urls]
Homepage = "https://github.com/vitalops/opendesk"
Documentation = "https://vitalops.ai/opendesk/docs/"
Repository = "https://github.com/vitalops/opendesk"
Issues = "https://github.com/vitalops/opendesk/issues"
Changelog = "https://github.com/vitalops/opendesk/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["opendesk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
